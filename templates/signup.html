<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Finance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.signup-box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 320px;
}

.signup-box h2 {
    margin-bottom: 20px;
    text-align: center;
    color: #2c3e50;
}

.signup-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.signup-box input:focus {
    outline: none;
    border-color: #3498db;
}

.signup-box button {
    width: 100%;
    padding: 10px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
}

.signup-box button:hover {
    background: #27ae60;
}

.back-link {
    padding: 10px;
    text-align: center;
    margin-top: 10px;
}

.back-link a {
    color: #3498db;
    text-decoration: none;
    font-size: 14px;
}

.flash {
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    text-align: center;
}

.flash.error {
    background: #e74c3c;
    color: white;
}

.flash.success {
    background: #2ecc71;
    color: white;
}
</style>
</head>
<body>
<div class="signup-box">
    <h2>🔐 Sign Up</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
    </form>

    <div class="back-link">
        <a href="{{ url_for('login') }}">← Already have an account? Log in</a>
    </div>
</div>
</body>
</html>
