<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Finance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; background:#f0f2f5; display:flex; align-items:center; justify-content:center; height:100vh; }
.login-box { background:white; padding:30px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:320px; }
.login-box h2 { margin-bottom:20px; text-align:center; }
.login-box input { width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; }
.login-box button { width:100%; padding:10px; background:#3498db; color:white; border:none; border-radius:6px; cursor:pointer; }
.login-box button:hover { background:#2980b9; }
.flash { padding:10px; border-radius:6px; margin-bottom:10px; text-align:center; }
.flash.error { background:#e74c3c; color:white; }
.flash.success { background:#2ecc71; color:white; }
</style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
