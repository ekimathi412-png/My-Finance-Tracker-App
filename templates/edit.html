<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Transaction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

/* FORM */
label {
    display: block;
    margin-top: 15px;
    font-weight: 500;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
    transition: 0.2s;
}

input:focus, select:focus {
    border-color: #3498db;
    outline: none;
}

/* BUTTONS */
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.save-btn {
    background: #2ecc71;
    color: white;
}

    .mobile-menu-toggle {
        display: none;
        width: 100%;
        margin-bottom: 18px;
        padding: 14px 16px;
        border: none;
        border-radius: 20px;
        background: rgba(52, 152, 219, 0.95);
        color: white;
        font-size: 16px;
        cursor: pointer;
        text-align: center;
    }

@media (max-width: 600px) {
    .mobile-menu-toggle {
        display: inline-flex;
    }

    .mobile-menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 420px;
        margin: 0 auto 20px;
    }

    .mobile-menu.open {
        display: flex;
    }

    .mobile-menu a {
        display: inline-flex;
        justify-content: center;
        gap: 10px;
        padding: 14px 16px;
        background: rgba(52, 152, 219, 0.15);
        border: 1px solid rgba(52, 152, 219, 0.3);
        border-radius: 18px;
        text-decoration: none;
        color: #2c3e50;
        font-weight: 600;
    }

    .mobile-menu a:hover {
        background: rgba(52, 152, 219, 0.25);
    }

    body {
        padding: 18px;
        min-height: auto;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        max-width: 100%;
        margin: 20px 0;
        padding: 24px;
    }

    .btn-group {
        flex-direction: column;
    }

    button, .cancel-btn {
        width: 100%;
    }
}

.save-btn:hover {
    background: #27ae60;
}

.cancel-btn {
    background: #e74c3c;
    color: white;
    text-decoration: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

.cancel-btn:hover {
    background: #c0392b;
}
</style>
</head>

<body>

<button class="mobile-menu-toggle" type="button" onclick="toggleMobileMenu()">☰ Menu</button>
<div id="mobileMenu" class="mobile-menu">
    <a href="/">🏠 Dashboard</a>
    <a href="/add">➕ Add Transaction</a>
    <a href="/reports">📊 Reports</a>
</div>

<div class="container">
    <h1>✏️ Edit Transaction</h1>

    <form method="POST">
        <label>Type</label>
        <select name="type">
            <option value="Income" {% if t.Type=='Income' %}selected{% endif %}>Income</option>
            <option value="Expense" {% if t.Type=='Expense' %}selected{% endif %}>Expense</option>
        </select>

        <label>Category</label>
        <input type="text" name="category" value="{{ t.Category }}">

        <label>Amount ($)</label>
        <input type="number" step="0.01" name="amount" value="{{ t.Amount }}">
         
        <label>Date</label>
        <input type="date" name="date" value="{{ t.Date }}">
        
        <div class="btn-group">
            <button type="submit" class="save-btn">Update</button>
            <a href="/" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>

<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    if (!menu) return;
    menu.classList.toggle('open');
}
</script>
</body>
</html>
