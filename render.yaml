services:
  - type: web
    name: finance-tracker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db

databases:
  - name: finance-db
    databaseName: finance
    user: render
    password: true
    plan: free
